# ============================================================================
# PolyMind Nginx 反向代理配置
# 关键点：/api/chat 等流式接口必须关闭缓冲，保证 token 级 SSE 实时下发
# ============================================================================

user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  2048;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ---- 日志 ----
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';
    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    server_tokens   off;

    # 允许图片上传（多模态对话）
    client_max_body_size 20m;

    # ---- 静态资源 gzip 压缩（流式响应不压缩，避免缓冲）----
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff2;

    # 上游应用
    upstream polymind_app {
        server app:3000;
        keepalive 32;
    }

    # ------------------------------------------------------------------------
    # HTTP(80)：ACME 校验放行，其余 301 跳转 HTTPS
    # ------------------------------------------------------------------------
    server {
        listen 80;
        listen [::]:80;
        server_name _;

        # Let's Encrypt webroot 续期校验
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ------------------------------------------------------------------------
    # HTTPS(443)：主站
    # ------------------------------------------------------------------------
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name _;

        # Let's Encrypt 证书（由 certbot 签发，挂载到 /etc/nginx/certs）
        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;

        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;

        # 安全响应头
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;

        # --------------------------------------------------------------------
        # 流式接口：/api/chat —— 关闭缓冲，实现 token 级实时流（SSE）
        # --------------------------------------------------------------------
        location /api/chat {
            proxy_pass http://polymind_app;

            # 通用转发头（见 proxy_params.conf；必须在每个 location 内 include）
            include /etc/nginx/proxy_params.conf;

            # 关键：禁止缓冲，token 立即下发
            proxy_buffering           off;
            proxy_cache               off;
            chunked_transfer_encoding off;

            # 保持长连接 + 清空 Connection（SSE 不复用语义）
            proxy_http_version 1.1;
            proxy_set_header Connection '';

            # SSE/WebSocket 升级支持
            proxy_set_header Upgrade    $http_upgrade;

            # 流式会话可能很长，放宽读超时
            proxy_read_timeout  3600s;
            proxy_send_timeout  3600s;
        }

        # --------------------------------------------------------------------
        # 其余请求：常规反向代理（含 WebSocket 升级）
        # --------------------------------------------------------------------
        location / {
            proxy_pass http://polymind_app;

            include /etc/nginx/proxy_params.conf;

            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_read_timeout  300s;
        }
    }
}
